name: siem-elkstack-uth

services:
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_STACK_VERSION}
    user: "0"
    volumes:
      - ../config/elasticsearch:/usr/share/elasticsearch/config/lab-config:ro
      - ../config/elasticsearch/certs:/usr/share/elasticsearch/config/certs
    command: >-
      bash -c '
        set -euo pipefail;
        if [ ! -f config/certs/elasticsearch/elasticsearch.crt ]; then
          rm -rf config/certs/*;
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip;
          unzip -qo config/certs/ca.zip -d config/certs;
          bin/elasticsearch-certutil cert --silent --pem \
            --in config/lab-config/instances.yml \
            --ca-cert config/certs/ca/ca.crt \
            --ca-key config/certs/ca/ca.key \
            -out config/certs/certs.zip;
          unzip -qo config/certs/certs.zip -d config/certs;
          rm -f config/certs/*.zip;
          chown -R 1000:0 config/certs;
          find config/certs -type d -exec chmod 750 {} \;;
          find config/certs -type f -exec chmod 640 {} \;;
        fi
      '

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_STACK_VERSION}
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      - node.name=elasticsearch
      - cluster.name=siem-lab
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/elasticsearch/elasticsearch.key
      - xpack.security.http.ssl.certificate=certs/elasticsearch/elasticsearch.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.security.transport.ssl.key=certs/elasticsearch/elasticsearch.key
      - xpack.security.transport.ssl.certificate=certs/elasticsearch/elasticsearch.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    volumes:
      - ../config/elasticsearch/certs:/usr/share/elasticsearch/config/certs:ro
      - elasticsearch-data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail --cacert config/certs/ca/ca.crt -u elastic:$$ELASTIC_PASSWORD https://localhost:9200/_cluster/health"]
      interval: 15s
      timeout: 10s
      retries: 20

  bootstrap:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_STACK_VERSION}
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - KIBANA_SYSTEM_PASSWORD=${KIBANA_SYSTEM_PASSWORD}
      - LOGSTASH_INTERNAL_PASSWORD=${LOGSTASH_INTERNAL_PASSWORD}
    volumes:
      - ../config/elasticsearch/certs:/usr/share/elasticsearch/config/certs:ro
    command: >-
      bash -c '
        set -euo pipefail;
        curl --silent --show-error --fail --cacert config/certs/ca/ca.crt \
          -u elastic:$$ELASTIC_PASSWORD \
          -X POST https://elasticsearch:9200/_security/user/kibana_system/_password \
          -H "Content-Type: application/json" \
          -d "{\"password\":\"$$KIBANA_SYSTEM_PASSWORD\"}";
        curl --silent --show-error --fail --cacert config/certs/ca/ca.crt \
          -u elastic:$$ELASTIC_PASSWORD \
          -X PUT https://elasticsearch:9200/_security/role/logstash_writer \
          -H "Content-Type: application/json" \
          -d "{\"cluster\":[\"monitor\",\"manage_index_templates\",\"manage_ilm\"],\"indices\":[{\"names\":[\"siem-*\"],\"privileges\":[\"write\",\"create_index\",\"manage\"]}] }";
        curl --silent --show-error --fail --cacert config/certs/ca/ca.crt \
          -u elastic:$$ELASTIC_PASSWORD \
          -X PUT https://elasticsearch:9200/_security/user/logstash_internal \
          -H "Content-Type: application/json" \
          -d "{\"password\":\"$$LOGSTASH_INTERNAL_PASSWORD\",\"roles\":[\"logstash_writer\"]}";
      '

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_STACK_VERSION}
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      - SERVER_NAME=siem-kibana
      - ELASTICSEARCH_HOSTS=https://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=${KIBANA_SYSTEM_USER}
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD}
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=/usr/share/kibana/config/certs/ca/ca.crt
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTED_SAVED_OBJECTS_KEY}
    volumes:
      - ../config/elasticsearch/certs:/usr/share/kibana/config/certs:ro
    ports:
      - "192.168.109.10:${KIBANA_PORT}:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:5601/api/status >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_STACK_VERSION}
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      - LOGSTASH_INTERNAL_USER=${LOGSTASH_INTERNAL_USER}
      - LOGSTASH_INTERNAL_PASSWORD=${LOGSTASH_INTERNAL_PASSWORD}
      - LS_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - ../config/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ../config/elasticsearch/certs:/usr/share/logstash/config/certs:ro
    ports:
      - "192.168.109.10:${LOGSTASH_BEATS_PORT}:5044"
      - "192.168.109.10:${LOGSTASH_SYSLOG_UDP_PORT}:5514/udp"
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:9600/_node/pipelines >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20

volumes:
  elasticsearch-data:
