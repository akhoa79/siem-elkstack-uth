input {
  beats {
    id => "winlogbeat_tls"
    port => 5044
    ssl_enabled => true
    ssl_certificate => "/usr/share/logstash/config/certs/logstash/logstash.crt"
    ssl_key => "/usr/share/logstash/config/certs/logstash/logstash.key"
  }

  syslog {
    id => "pfsense_udp"
    port => 5514
    type => "pfsense"
  }
}

filter {
  if [agent][type] == "winlogbeat" {
    mutate {
      add_field => { "[event][module]" => "windows" }
      add_field => { "[event][dataset]" => "windows.eventlog" }
    }
  } else if [type] == "pfsense" {
    mutate {
      add_field => { "[event][module]" => "pfsense" }
      add_field => { "[event][dataset]" => "pfsense.log" }
    }

    # pfSense filterlog emits comma-separated packet fields.  Keep the
    # original Syslog event intact while exposing fields useful in Discover,
    # dashboards, and detection rules.
    if [process][name] == "filterlog" and [message] =~ /^\d+,/ {
      csv {
        source => "message"
        target => "[pfsense][filter]"
        columns => [
          "rule", "subrule", "anchor", "tracker", "interface", "reason",
          "action", "direction", "ip_version", "tos", "ecn", "ttl", "id",
          "offset", "flags", "protocol_id", "protocol", "length", "source_ip",
          "destination_ip", "source_port", "destination_port", "data_length",
          "tcp_flags", "sequence_number", "acknowledgement_number", "window",
          "urgent", "options"
        ]
      }

      mutate {
        replace => {
          "[event][kind]" => "event"
          "[event][category]" => "network"
          "[event][type]" => "connection"
          "[event][action]" => "%{[pfsense][filter][action]}"
          "[event][reason]" => "%{[pfsense][filter][reason]}"
          "[network][protocol]" => "ipv%{[pfsense][filter][ip_version]}"
          "[network][transport]" => "%{[pfsense][filter][protocol]}"
          "[source][ip]" => "%{[pfsense][filter][source_ip]}"
          "[destination][ip]" => "%{[pfsense][filter][destination_ip]}"
          "[source][port]" => "%{[pfsense][filter][source_port]}"
          "[destination][port]" => "%{[pfsense][filter][destination_port]}"
          "[observer][ingress][interface][name]" => "%{[pfsense][filter][interface]}"
        }
        convert => {
          "[pfsense][filter][rule]" => "integer"
          "[pfsense][filter][tracker]" => "integer"
          "[pfsense][filter][ip_version]" => "integer"
          "[pfsense][filter][protocol_id]" => "integer"
          "[pfsense][filter][length]" => "integer"
          "[source][port]" => "integer"
          "[destination][port]" => "integer"
        }
      }

      if [pfsense][filter][action] == "block" {
        mutate { add_tag => ["pfsense_firewall_block"] }
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["https://elasticsearch:9200"]
    user => "${LOGSTASH_INTERNAL_USER}"
    password => "${LOGSTASH_INTERNAL_PASSWORD}"
    ssl_enabled => true
    ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca/ca.crt"]
    index => "siem-%{[event][module]}-%{+YYYY.MM.dd}"
    ilm_enabled => false
  }
}
