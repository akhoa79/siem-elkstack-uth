input {
  beats {
    id => "winlogbeat_tls"
    port => 5044
    ssl_enabled => true
    ssl_certificate => "/usr/share/logstash/config/certs/logstash/logstash.crt"
    ssl_key => "/usr/share/logstash/config/certs/logstash/logstash.key"
  }

  syslog {
    id => "pfsense_udp"
    port => 5514
    type => "pfsense"
  }
}

filter {
  if [type] == "pfsense" {
    mutate {
      add_field => { "[event][module]" => "pfsense" }
      add_field => { "[event][dataset]" => "pfsense.log" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["https://elasticsearch:9200"]
    user => "${LOGSTASH_INTERNAL_USER}"
    password => "${LOGSTASH_INTERNAL_PASSWORD}"
    ssl_enabled => true
    ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca/ca.crt"]
    index => "siem-%{[event][module]}-%{+YYYY.MM.dd}"
    ilm_enabled => false
  }
}
